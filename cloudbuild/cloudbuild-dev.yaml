options:
  logging: CLOUD_LOGGING_ONLY

steps:

- name: hashicorp/terraform:latest
  entrypoint: sh
  args:
    - -c
    - |
      cd Terraform

      terraform init \
        -backend-config="bucket=bucket280926-tfstate" \
        -backend-config="prefix=dev"

      terraform validate

      terraform plan -var-file=dev.tfvars

- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: bash
  args:
    - -c
    - |
      echo "Déploiement des DAG dans Cloud Composer..."

      gsutil cp \
      dags/clientstreamdemodag.py \
      gs://europe-west1-composer-demo-65922e78-bucket/dags/
      
      gsutil cp \
      dags/customer_orders.py.py \
      gs://europe-west1-composer-demo-65922e78-bucket/dags/
      
      
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: bash
  args:
    - -c
    - |
      echo "Déploiement du script Dataflow..."

      gsutil cp \
      dataflow/clientStreamDemo2.py \
      gs://bucket280926-demo-dev/dataflow/
      
      gsutil cp \
      dataflow/Customers_Orders.py \
      gs://bucket280926-demo-dev/dataflow/
